<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Crooli Sans is the default sans-serif everywhere, with Noto as fallback
     for scripts and symbols it does not cover. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Crooli Sans</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Crooli Sans</family>
    </prefer>
  </alias>
</fontconfig>
