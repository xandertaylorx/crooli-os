name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["web/**", "**.md"]
  pull_request:
    paths-ignore: ["web/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install live-build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates live-build debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
            syslinux syslinux-common isolinux

      - uses: actions/checkout@v4

      - name: Build
        run: |
          lb config
          lb build

      - name: Checksum
        run: |
          ISO=$(ls *.iso)
          sha256sum "$ISO" > "$ISO.sha256"
          ls -lh "$ISO"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: crooli-os-iso
          path: |
            *.iso
            *.iso.sha256
          compression-level: 0
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            *.iso.sha256
          generate_release_notes: true
