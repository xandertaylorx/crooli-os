# Crooli OS installer. Five short screens, then it does the rest.
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id: bootloader
  module: shellprocess
  config: shellprocess-bootloader.conf
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@bootloader
  - packages
  - shellprocess@cleanup
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: crooli
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
