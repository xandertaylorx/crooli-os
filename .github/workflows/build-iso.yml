name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["web/**", "**.md", "vercel.json"]
  pull_request:
    paths-ignore: ["web/**", "**.md", "vercel.json"]
  workflow_dispatch:

# A newer push replaces any build still running for the same branch.
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  iso:
    name: ISO (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel and AMD PCs
          - arch: amd64
            runner: ubuntu-latest
            host_packages: grub-efi-amd64-bin grub-pc-bin syslinux syslinux-common isolinux
          # Apple silicon (in UTM, Parallels, VMware) and ARM PCs
          - arch: arm64
            runner: ubuntu-24.04-arm
            host_packages: grub-efi-arm64-bin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install live-build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates apt-utils live-build debootstrap squashfs-tools xorriso \
            mtools dosfstools ${{ matrix.host_packages }}

      - uses: actions/checkout@v4

      - name: Build
        run: |
          lb config
          lb build

      - name: Verify image contents
        run: |
          SQ=$(find binary/live -name 'filesystem.squashfs' | head -1)
          test -n "$SQ" || { echo "no squashfs found"; exit 1; }
          unsquashfs -ll "$SQ" > /tmp/files.txt
          unsquashfs -cat "$SQ" var/lib/dpkg/status > /tmp/dpkg-status
          fail=0
          EXTRA=""
          # Older BIOS PCs only exist on Intel/AMD.
          [ "${{ matrix.arch }}" = amd64 ] && EXTRA="usr/share/crooli/bootloader/bios"
          for p in \
            usr/share/gnome-shell/extensions/crooli-theme@crooli.com/extension.js \
            usr/share/gnome-shell/extensions/crooli-theme@crooli.com/stylesheet.css \
            usr/share/gnome-shell/extensions/crooli-theme@crooli.com/metadata.json \
            etc/dconf/db/crooli etc/dconf/db/gdm \
            etc/skel/.config/gtk-4.0/gtk.css etc/skel/.config/gtk-3.0/gtk.css \
            usr/share/crooli/theme/gtk4-light.css \
            usr/share/plymouth/themes/crooli/logo.png usr/share/plymouth/themes/crooli/crooli.script \
            usr/share/icons/hicolor/256x256/apps/crooli-os.png \
            usr/share/icons/Papirus-Dark/index.theme \
            usr/share/fonts/truetype/crooli-sans/CrooliSans-Variable.ttf \
            etc/skel/.local/share/org.gnome.Ptyxis/palettes/crooli.palette \
            usr/share/applications/com.crooli.Welcome.desktop \
            usr/share/glib-2.0/schemas/90_crooli.gschema.override \
            usr/bin/crooli-welcome usr/bin/crooli-install \
            usr/sbin/crooli-bootloader-config usr/share/crooli/bootloader/efi $EXTRA \
            etc/calamares/settings.conf etc/calamares/modules/users.conf; do
            grep -q "squashfs-root/$p" /tmp/files.txt || { echo "MISSING: $p"; fail=1; }
          done
          for pkg in user-setup live-config live-boot calamares gdm3 ptyxis flatpak \
            papirus-icon-theme gnome-shell-extension-dashtodock gnome-software nautilus \
            linux-image-${{ matrix.arch }}; do
            grep -q "^Package: $pkg\$" /tmp/dpkg-status || { echo "PACKAGE NOT INSTALLED: $pkg"; fail=1; }
          done
          unsquashfs -cat "$SQ" usr/lib/os-release | grep -q 'NAME="Crooli OS"' || { echo "os-release not Crooli"; fail=1; }
          unsquashfs -cat "$SQ" etc/dconf/db/crooli | grep -aq 'Papirus-Dark' || { echo "dconf db missing Crooli settings"; fail=1; }
          unsquashfs -cat "$SQ" usr/share/glib-2.0/schemas/gschemas.compiled | grep -aq 'crooli' || { echo "schema override not compiled"; fail=1; }
          # The boot menu must be ours, not Debian's. live-build turns the SVG
          # into splash.png and then deletes the SVG, so check the source we
          # ship and that the picture was generated.
          grep -q 'os.crooli.com' config/bootloaders/splash.svg || { echo "config/bootloaders/splash.svg is not Crooli's"; fail=1; }
          grep -q 'emblem-vendor-scalable -> /usr/share/icons/crooli/scalable/emblems/emblem-crooli.svg' /tmp/files.txt || { echo "Settings > About would still show the Debian logo"; fail=1; }
          grep -q '^title-text: ""' binary/boot/grub/live-theme/theme.txt || { echo "boot menu still has the Live Boot Menu title"; fail=1; }
          test -s binary/boot/grub/splash.png || { echo "no boot menu image was generated"; fail=1; }
          [ "$fail" = 0 ] && echo "Image contents verified for ${{ matrix.arch }}."
          exit $fail

      - name: Name and checksum
        run: |
          # Fixed names, so the website can link to the latest release directly.
          mv ./*.iso "crooli-os-${{ matrix.arch }}.iso"
          sha256sum "crooli-os-${{ matrix.arch }}.iso" > "crooli-os-${{ matrix.arch }}.iso.sha256"
          ls -lh crooli-os-*

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: crooli-os-iso-${{ matrix.arch }}
          path: |
            crooli-os-*.iso
            crooli-os-*.iso.sha256
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: crooli-os-iso-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Crooli OS ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            A calm, fast desktop for people who have never used Linux.

            **Pick the right download**

            | Your computer | Download |
            |---|---|
            | Intel or AMD PC | `crooli-os-amd64.iso` |
            | Mac with Apple silicon (M1 and later), in UTM, Parallels or VMware, or an ARM PC | `crooli-os-arm64.iso` |

            1. Download the `.iso` file for your computer.
            2. On a PC, write it to a USB stick with [balenaEtcher](https://etcher.balena.io), then start the PC from the stick. On a Mac, open it in [UTM](https://mac.getutm.app) and choose **Virtualize**.
            3. Try it, then click **Install Crooli OS** in the dock.

            Each file has a matching `.sha256` checksum. Needs 2 GB of memory and 16 GB of storage. More at https://os.crooli.com
          files: |
            crooli-os-*.iso
            crooli-os-*.iso.sha256
