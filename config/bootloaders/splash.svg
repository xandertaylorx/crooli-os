      <stop offset="0" stop-color="#0a6cf0" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0a3fa0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="#0a0a0a"/>
  <rect width="640" height="480" fill="url(#glow)"/>
